[package]
name = "agy-switch"
version = "4.9.4"
description = "Local Antigravity account switching and usage dashboard"
authors = ["you"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"
default-run = "agy-switch-desktop"

[[bin]]
name = "agy-switch-desktop"
path = "src/main.rs"

[[example]]
name = "macos-desktop-check"
path = "../scripts/fixtures/macos-desktop.rs"

[[example]]
name = "desktop-lifecycle-check"
path = "../scripts/fixtures/desktop-lifecycle.rs"
required-features = ["native-gui-test"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "antigravity_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.2.5", features = [] }

[dependencies]
tauri = { version = "^2.2.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sysinfo = "0.31"
sys-locale = "0.3.2"
tokio = { version = "1", features = ["full"] }
url = "2.5.7"
tauri-plugin-dialog = "2.6.0"
image = { version = "0.25.9", default-features = false, features = ["png", "webp"] }
thiserror = "2.0.17"

futures = "0.3"
rand = "0.8"
regex = "1.12.2"
once_cell = "1.19"
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
libc = "0.2"
tracing-appender = "0.2.4"
tracing-log = "0.2.0"
tauri-plugin-window-state = "2"
plist = "1.7"
rquest = { version = "5.1.0", features = ["json"] }
rquest-util = "2.2.1"
crossterm = "0.29.0"
tauri-plugin-updater = "~2.12.0"
tempfile = "3.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSTimer", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSMenu", "NSMenuItem", "NSView", "NSResponder", "NSControl", "NSButton", "NSAlert", "NSImage", "NSImageView", "NSCell", "NSText", "NSTextField", "NSFont", "NSColor", "NSBezierPath", "NSGraphics", "NSStatusItem", "NSStatusBarButton", "NSApplication", "NSRunningApplication", "NSEvent", "NSAppearance", "NSTrackingArea", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Debug-only native WebDriver acceptance; never enabled by the release workflow.
native-gui-test = []

[dev-dependencies]
