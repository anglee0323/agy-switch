name: Build macOS Intel

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-macos-intel.yml

permissions:
  contents: read

jobs:
  build:
    name: macOS (Intel x64)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false

      - name: Install frontend dependencies
        run: npm ci

      # The macOS bundler signs the main executable but leaves the console
      # binary it copies into Contents/MacOS unsigned, so its own codesign step
      # fails the outer bundle. Bundle without signing and seal the bundle here.
      - name: Build app bundle
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles app -- --locked

      - name: Sign app bundle
        run: |
          set -euo pipefail
          APP="$(ls -d src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app)"
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q 'Mach-O'; then
              codesign --force --sign - --timestamp=none "$file"
            fi
          done < <(find "$APP/Contents" -type f -perm -u+x -print0)
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify app bundle and CLI
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          APP="$(ls -d src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app)"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" == "com.lbjlaq.antigravity-tools-lite" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" == "$VERSION" ]]
          [[ "$(lipo -archs "$APP/Contents/MacOS/agy-switch-desktop")" == "x86_64" ]]
          [[ "$("$APP/Contents/MacOS/agy-switch-desktop" --version)" == "agy-switch $VERSION" ]]
          node scripts/test-cli.mjs "$APP/Contents/MacOS/agy-switch-desktop"

      - name: Package app bundle
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          APP="$(ls -d src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app)"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" "artifacts/agy-switch-${VERSION}-macos-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: agy-switch-macos-x64
          path: artifacts/*.zip
          retention-days: 14
